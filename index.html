<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Living Graph</title>

  <!-- Tailwind CSS & Resilient D3.js v7 Loader (jsdelivr with cdnjs fallback) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.__d3FallbackLoaded = false;
    window.__d3LoadFailed = false;
    function loadD3Fallback() {
      if (window.__d3FallbackLoaded) return;
      window.__d3FallbackLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js';
      s.onload = function () {
        if (typeof window.__bootLivingGraph === 'function') window.__bootLivingGraph();
      };
      s.onerror = function () {
        window.__d3LoadFailed = true;
        if (typeof window.__showD3Error === 'function') window.__showD3Error();
      };
      document.head.appendChild(s);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" onerror="loadD3Fallback()"></script>

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bg: '#0d0f12',
            surface: '#15181e',
            elevated: '#1c2028',
            border: '#282d38',
            muted: '#858d9d',
            bright: '#e5e7eb',
          },
        },
      },
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      color: #e5e7eb;
      font-family: 'Inter', system-ui, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #262a34;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3a404f;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #graph-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
    }

    .node-group {
      cursor: pointer;
    }
    .node-group:active {
      cursor: grabbing;
    }

    .edge-hit {
      cursor: pointer;
    }

    /* Clean monochrome range slider */
    input[type="range"].edge-slider {
      -webkit-appearance: none;
      appearance: none;
      background: #262a34;
      height: 4px;
      border-radius: 9999px;
      outline: none;
    }
    input[type="range"].edge-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background: #e4e6eb;
      cursor: pointer;
      border: 2px solid #0a0b0e;
      transition: transform 120ms ease;
    }
    input[type="range"].edge-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
      background: #ffffff;
    }
    input[type="range"].edge-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background: #e4e6eb;
      cursor: pointer;
      border: 2px solid #0a0b0e;
    }
  </style>
</head>
<body class="bg-bg text-bright select-none overflow-hidden flex flex-col h-screen w-screen">

  <!-- ==================== ULTRA-CLEAN SINGLE TOP BAR ==================== -->
  <header class="z-30 flex-shrink-0 w-full max-w-full bg-surface/95 backdrop-blur-md border-b border-border px-2.5 py-1.5 flex items-center justify-between gap-2 overflow-visible">
    <!-- LEFT: Rank Filter Pills + (+ Rank) -->
    <div id="rank-filter-bar" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5 min-w-0 flex-1">
      <!-- Populated dynamically with rank pills + "+ Rank" button -->
    </div>

    <!-- RIGHT: Sort Dropdown, Graph Lab, Edge Size Slider, Direct Save + Gear -->
    <div class="flex items-center gap-1.5 flex-shrink-0">
      <!-- Sort Dropdown -->
      <div class="relative" id="sort-dropdown-wrap">
        <button id="btn-sort" type="button"
          class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-border bg-elevated text-bright hover:border-muted transition flex items-center gap-1.5 whitespace-nowrap">
          <svg class="w-3.5 h-3.5 text-muted flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="14" y2="12"></line>
            <line x1="4" y1="18" x2="9" y2="18"></line>
          </svg>
          <span>Sort: <span id="sort-current-label" class="font-mono text-white">Force</span></span>
          <svg class="w-3 h-3 text-muted flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div id="sort-menu"
          class="hidden absolute right-0 mt-1.5 w-72 bg-surface/98 backdrop-blur-xl border border-border rounded-2xl shadow-2xl shadow-black/80 p-1.5 z-50 max-h-[75vh] overflow-y-auto">
          <!-- Populated dynamically with 10 sort/layout options -->
        </div>
      </div>

      <!-- Graph Lab Button -->
      <button id="btn-graph-lab" type="button"
        class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-border bg-elevated text-bright hover:border-muted transition flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5" cy="12" r="2.2"></circle>
          <circle cx="19" cy="6" r="2.2"></circle>
          <circle cx="19" cy="18" r="2.2"></circle>
          <path d="M7 11l10-4"></path>
          <path d="M7 13l10 4"></path>
        </svg>
        <span class="hidden sm:inline">Graph Lab</span>
        <span id="lab-active-dot" class="hidden w-1.5 h-1.5 rounded-full bg-cyan-300"></span>
      </button>

      <!-- Edge Size Slider -->
      <div class="hidden lg:flex items-center gap-1.5 px-2 py-1.5 rounded-xl border border-border bg-bg/80">
        <span class="text-[11px] font-mono text-muted">Edge</span>
        <input id="edge-size-slider" type="range" min="1.5" max="10" step="0.5" value="3.5"
          class="edge-slider w-16" title="Adjust edge thickness & arrowhead size" />
        <span id="edge-size-value" class="text-[11px] font-mono text-bright w-7 text-right">3.5</span>
      </div>

      <!-- Direct Save Button + Gear Icon -->
      <div class="flex items-center flex-shrink-0">
        <button id="btn-save" type="button" title="Save directly to GitHub repo (data.json)"
          class="px-2.5 py-1.5 rounded-l-xl text-xs font-semibold bg-bright text-bg hover:bg-white transition flex items-center gap-1.5 whitespace-nowrap border border-bright">
          <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span id="save-label">Save</span>
        </button>
        <button id="btn-save-settings" type="button" title="GitHub Repository Settings"
          class="px-2 py-1.5 rounded-r-xl border border-l-0 border-border bg-elevated text-muted hover:text-bright hover:border-muted transition flex items-center justify-center">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div class="relative flex-1 w-full overflow-hidden flex">

    <!-- LEFT DRAWER: GRAPH LAB (Graph Theory Structural Analysis) -->
    <aside id="graph-lab-drawer"
      class
