<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Living Graph</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --surface: #14161a;
      --elevated: #1c1f26;
      --border: #272a32;
      --border-hover: #424756;
      --text: #e6e8ec;
      --muted: #8b92a1;
      --dim: #555c6b;
      --accent-cyan: #67e8f9;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #272a32; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f4554; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* ==================== TOP BAR (48px, SINGLE ROW, NON-CLIPPING) ==================== */
    .topbar {
      height: 48px;
      flex-shrink: 0;
      width: 100%;
      background: rgba(20, 22, 26, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 30;
    }

    .rank-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      min-width: 0;
      flex: 1;
      padding: 2px 0;
    }

    .rank-pill {
      height: 28px;
      min-width: 28px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--elevated);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 120ms, border-color 120ms, opacity 120ms;
    }
    .rank-pill:hover { border-color: var(--border-hover); }
    .rank-pill.hidden-rank {
      background: transparent;
      color: var(--dim);
      opacity: 0.5;
      text-decoration: line-through;
    }
    .rank-pill.add-rank-btn {
      background: transparent;
      color: var(--muted);
      border-style: dashed;
      padding: 0 10px;
      font-size: 11px;
    }
    .rank-pill.add-rank-btn:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn {
      height: 30px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 120ms, border-color 120ms, color 120ms;
    }
    .btn:hover { border-color: var(--border-hover); background: #222630; }
    .btn.active { border-color: var(--text); background: #262b36; }
    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .btn-primary:hover { background: #ffffff; border-color: #ffffff; }

    .btn-group {
      display: inline-flex;
      align-items: center;
    }
    .btn-group .btn:first-child {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .btn-group .btn:last-child {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: none;
      padding: 0 8px;
    }

    .edge-control {
      height: 30px;
      padding: 0 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .edge-control span {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .edge-control .edge-val {
      color: var(--text);
      width: 26px;
      text-align: right;
    }

    input[type="range"].slider {
      -webkit-appearance: none;
      appearance: none;
      width: 66px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      border: 2px solid var(--bg);
      cursor: pointer;
    }
    input[type="range"].slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      border: 2px solid var(--bg);
      cursor: pointer;
    }

    /* Sort Dropdown */
    .dropdown-wrap { position: relative; }
    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 270px;
      max-height: 75vh;
      overflow-y: auto;
      background: rgba(20, 22, 26, 0.98);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.72);
      z-index: 60;
    }
    .sort-item {
      width: 100%;
      text-align: left;
      padding: 7px 9px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 100ms, border-color 100ms;
    }
    .sort-item:hover { background: var(--elevated); }
    .sort-item.selected { background: var(--elevated); border-color: var(--border-hover); }
    .sort-item-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sort-item-desc {
      font-size: 11px;
      color: var(--muted);
    }

    /* ==================== WORKSPACE & DRAWERS ==================== */
    .workspace {
      flex: 1;
      position: relative;
      display: flex;
      width: 100%;
      overflow: hidden;
    }

    .canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    #graph-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .empty-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 24px;
      z-index: 5;
    }
    .empty-hint p {
      margin: 0;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(139, 146, 161, 0.72);
      text-align: center;
      line-height: 1.6;
    }

    .action-banner {
      position: absolute;
      top: 12px;
